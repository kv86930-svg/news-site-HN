const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const get = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
let lang = get('gp_l') || (l => l.startsWith('te') ? 'te' : l.startsWith('hi') ? 'hi' : 'en')(navigator.language || ''), theme = get('gp_t') || 'auto', size = +(get('gp_z') || 100), q = '', saved = [];
try{ saved = JSON.parse(get('gp_s') || '[]'); }catch(e){}
const T = o => o[lang] || o.en, L = k => (U[lang] || U.en)[k] ?? U.en[k];

const pic = (a, alt) => `<div class="ph">${scene(a.p)}${a.img ? `<img src="${esc(a.img)}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()">` : ''}</div>`;

function ad(slot){

    return `<div class="ad" aria-label="${L('sp')}"><ins class="adsbygoogle" style="display:block" data-ad-client="${ADS.client}" data-ad-slot="${ADS.slots[slot]}" data-ad-format="auto" data-full-width-responsive="true"></ins></div>`;

}
function loadAds(){

  if(!document.getElementById('adjs')){ const s = document.createElement('script'); s.id = 'adjs'; s.async = true; s.crossOrigin = 'anonymous'; s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + ADS.client; document.head.appendChild(s); }
  document.querySelectorAll('ins.adsbygoogle:not([data-done])').forEach(i => { i.dataset.done = 1; try{ (window.adsbygoogle = window.adsbygoogle || []).push({}); }catch(e){} });
}
function prefs(){

};
const secHead = (title, href) => `<div class="sech"><h2 class="sec">${esc(title)}</h2>${href ? `<a href="${href}">${L('more')}</a>` : ''}</div>`;

function home(){
  document.title = 'GlobalPulse 24/7 – Telangana, National & World News';
  const f = SORTED[0]; let h = hero(f) + ad('top');
  CATS.forEach(c => { const r = SORTED.filter(x => x.c === c && x.id !== f.id).slice(0, 3); if(r.length) h += secHead(L(c), '#c-' + c) + grid(r); });
  h += secHead(L('vid'), '#p-videos') + `<div class="grid">${V.map(vidCard).join('')}</div>`;
  return h;
}
function listView(title, r){ document.title = title + ' | GlobalPulse 24/7'; return secHead(title) + grid(r); }
function article(id){

  let s = document.getElementById('ld'); if(!s){ s = document.createElement('script'); s.id = 'ld'; s.type = 'application/ld+json'; document.head.appendChild(s); } s.textContent = JSON.stringify(ld);
  const url = SITE + '/#a-' + a.id, rel = SORTED.filter(x => x.c === a.c && x.id !== a.id).slice(0, 3);
  const body = paras.map((p, i) => `<p>${esc(p)}</p>` + (i === 0 ? ad('mid') : '')).join('');
  return `<a class="back" href="#">${L('back')}</a><article class="art">${pic(a, t)}<div class="body">${tag(a)}<h1>${esc(t)}</h1>
    <div class="meta">${L('by')} ${esc(a.by)} · ${fdate(a.d)} · ${mins(a)} ${L('min')}</div>${ad('top')}
    <p style="font-weight:600">${esc(T(a.s))}</p>${body}
    <div class="share"><a class="ib" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t + ' ' + url)}">${L('wa')}</a><button class="ib" data-share="${a.id}">${L('share')}</button><button class="ib" data-copy="${a.id}">${L('copy')}</button><button class="ib" data-sv="${a.id}">${on ? L('svd') : L('sv')}</button></div>${ad('end')}</div></article>
    ${rel.length ? secHead(L('rel')) + grid(rel) : ''}`;
}
function page(k){
  const [t, secs] = PAGES[k][lang] || PAGES[k].en; document.title = t + ' | GlobalPulse 24/7';
  const body = secs.map(([h, p]) => `<h3>${esc(h)}</h3><p>${esc(p).replace(/(https?:\/\/[^\s)]+)/g, '<a href="$1" target="_blank" rel="noopener" style="text-decoration:underline">$1</a>')}</p>`).join('');

function prefsPage(){

function render(){
  const h = location.hash.slice(1), m = h.match(/^([a-z]+)-(.+)$/), type = m && m[1], val = m && m[2];

const drawer = on => { $('drawer').classList.toggle('on', on); $('scrim').classList.toggle('on', on); };
window.addEventListener('hashchange', () => { q = ''; $('q').value = ''; drawer(false); render(); window.scrollTo(0, 0); });
function toast(m){ const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2200); }
document.addEventListener('click', async e => {
  if(e.target.closest('#drawer a')) drawer(false);
  const t = e.target.closest('[data-l],[data-z],[data-nov],[data-share],[data-copy],[data-sv],[data-clr],[data-rst]'); if(!t) return;

    try{ if(d.share && navigator.share) await navigator.share(p); else { await navigator.clipboard.writeText(p.url); toast(L('copied')); } }catch(err){} }
});
document.addEventListener('change', e => { if(e.target.id === 'thSel'){ theme = e.target.value; store('gp_t', theme); prefs(); } });
$('mb').onclick = () => drawer(true); $('scrim').onclick = () => drawer(false);
document.addEventListener('keydown', e => { if(e.key === 'Escape') drawer(false); });
$('q').oninput = e => { q = e.target.value; render(); };
$('dm').onclick = () => { theme = document.documentElement.classList.contains('dk') ? 'light' : 'dark'; store('gp_t', theme); prefs(); };
const consent = c => { store('gp_c', c); $('cb').style.display = 'none'; render(); };
$('cy').onclick = () => consent('1'); $('cn').onclick = () => consent('0');
if(ADS.client && get('gp_c') === null) $('cb').style.display = 'flex';
render();
</script>
