<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudySnap AI – 9th Class Study Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--paper:#f3f7fb;--card:#fff;--line:#d5e0ee;--blue:#2f5bea;--hi:#ffe45e;--mute:#5b6882;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--ink:#e8edf8;--paper:#0f1626;--card:#18223a;--line:#2a3857;--blue:#7d9bff;--hi:#ffe45e;--mute:#9aa7c4;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.6 Lexend,system-ui,sans-serif;color:var(--ink);background:var(--paper);
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--hi);display:grid;place-items:center;font-size:24px;color:#14213d;transform:rotate(-6deg)}
h1{font-size:1.5rem;margin:0;line-height:1.1}
header p{margin:0;color:var(--mute);font-size:.85rem}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:16px;box-shadow:4px 4px 0 var(--ink)}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.row{grid-template-columns:1fr}}
label,.lbl{display:block;font-weight:500;font-size:.85rem;margin-bottom:6px}
.seg{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;margin:0;text-align:center;padding:9px 4px;cursor:pointer;font-size:.85rem;border-right:2px solid var(--ink)}
.seg label:last-of-type{border-right:0}
.seg input:checked+label{background:var(--ink);color:var(--paper)}
.seg input:focus-visible+label{outline:3px solid var(--blue);outline-offset:-3px}
select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:10px}
textarea{min-height:110px;resize:vertical}
select:focus,textarea:focus{outline:3px solid var(--blue);outline-offset:1px}
.field{margin-top:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:500;cursor:pointer;border:2px solid var(--ink);border-radius:10px;padding:10px 14px;background:var(--card);color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--hi);color:#14213d}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.go{width:100%;justify-content:center;background:var(--hi);color:#14213d;font-size:1.05rem;padding:13px;margin-top:16px}
.go:hover{background:#ffd800}
.go:disabled{opacity:.6;cursor:wait}
#preview{display:none;margin-top:12px;position:relative}
#preview img{max-width:100%;max-height:320px;display:block;border-radius:10px;border:2px solid var(--ink);background:#fff}
#rm{position:absolute;top:8px;right:8px;padding:4px 10px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:500;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--blue)}
#out{margin-top:22px}
.ans{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:18px;box-shadow:4px 4px 0 var(--ink)}
.ans h2{font-size:1.05rem;margin:18px 0 6px;padding-bottom:4px;border-bottom:3px solid var(--hi);display:inline-block}
.ans h2:first-child{margin-top:0}
.ans ul,.ans ol{margin:4px 0 8px;padding-left:22px}
.ans li{margin:5px 0}
.ans code{background:var(--paper);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
.ans mark{background:var(--hi);color:#14213d;padding:0 3px;border-radius:3px}
.note{background:var(--hi);color:#14213d;border-radius:4px;padding:14px 16px;margin-top:20px;transform:rotate(-.6deg);box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.note h2{border:0;margin:0 0 4px;font-family:Caveat,cursive;font-size:1.7rem;display:block}
.note p{margin:0}
.tools{display:flex;justify-content:flex-end;margin-top:12px}
.err{color:var(--err);font-weight:500}
.load{display:flex;align-items:center;gap:14px}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--blue);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-8px);opacity:1}}
.sk{height:14px;border-radius:7px;margin-top:12px;background:linear-gradient(90deg,var(--line),var(--paper),var(--line));background-size:200% 100%;animation:s 1.4s infinite}
@keyframes s{to{background-position:-200% 0}}
.demo{font-size:.8rem;color:var(--mute);margin-top:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">📸</div>
    <div><h1>StudySnap AI</h1><p>Snap or type a question. Get it explained simply.</p></div>
  </header>

  <main class="panel">
    <div class="lbl">Board</div>
    <div class="seg" role="radiogroup" aria-label="Board">
      <input type="radio" name="board" id="b1" value="TS-SSC" checked><label for="b1">TS-SSC</label>
      <input type="radio" name="board" id="b2" value="CBSE"><label for="b2">CBSE</label>
      <input type="radio" name="board" id="b3" value="ICSE"><label for="b3">ICSE</label>
    </div>

    <div class="row field">
      <div><label for="subject">Subject</label>
        <select id="subject">
          <option>Mathematics</option><option>Physical Science</option><option>Biological Science</option>
          <option>Social Studies</option><option>English</option><option>Telugu</option><option>Hindi</option><option>Computer Science</option>
        </select></div>
      <div><label for="grade">Class</label>
        <select id="grade"><option>9th Class</option></select></div>
    </div>

    <div class="field">
      <div class="lbl">Photo of the question</div>
      <div class="btns">
        <button class="btn" id="cam" type="button">📷 Take photo</button>
        <button class="btn" id="gal" type="button">🖼️ Upload image</button>
      </div>
      <input id="fileCam" type="file" accept="image/*" capture="environment" hidden>
      <input id="fileGal" type="file" accept="image/*" hidden>
      <div id="preview"><img id="pimg" alt="Preview of your question"><button class="btn" id="rm" type="button">Remove</button></div>
    </div>

    <div class="field">
      <label for="q">Or type your question</label>
      <textarea id="q" placeholder="e.g. Find the zeroes of x² − 5x + 6"></textarea>
    </div>

    <label class="toggle"><input type="checkbox" id="eli13" checked> Explain Like I'm 13</label>
    <button class="btn go" id="go" type="button">Explain it to me</button>
  </main>

  <section id="out" aria-live="polite"></section>
</div>

<script>
// ===== CONFIG =====
const API_URL = '/api/solve';   // your backend endpoint (see server.js)
const MAX_SIDE = 1280;          // image is resized before upload
// ==================
const $ = id => document.getElementById(id);
let imageData = null;

function setImage(file){
  if(!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    imageData = c.toDataURL('image/jpeg', .85);
    $('pimg').src = imageData; $('preview').style.display = 'block';
    URL.revokeObjectURL(url);
  };
  img.onerror = () => showErr('That file could not be read as an image. Try another photo.');
  img.src = url;
}
function clearImage(){ imageData = null; $('preview').style.display = 'none'; $('fileCam').value = $('fileGal').value = ''; }
$('cam').onclick = () => $('fileCam').click();
$('gal').onclick = () => $('fileGal').click();
$('fileCam').onchange = e => setImage(e.target.files[0]);
$('fileGal').onchange = e => setImage(e.target.files[0]);
$('rm').onclick = clearImage;

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>').replace(/`(.+?)`/g,'<code>$1</code>');
function md(text){
  let h = '', list = null;
  const close = () => { if(list){ h += `</${list}>`; list = null; } };
  for(const raw of text.split('\n')){
    const l = raw.trim();
    let m;
    if(!l){ close(); continue; }
    if(m = l.match(/^#{1,3}\s+(.*)/)){ close(); h += `<h2>${inline(m[1])}</h2>`; }
    else if(m = l.match(/^[-*•]\s+(.*)/)){ if(list !== 'ul'){ close(); h += '<ul>'; list = 'ul'; } h += `<li>${inline(m[1])}</li>`; }
    else if(m = l.match(/^\d+[.)]\s+(.*)/)){ if(list !== 'ol'){ close(); h += '<ol>'; list = 'ol'; } h += `<li>${inline(m[1])}</li>`; }
    else { close(); h += `<p>${inline(l)}</p>`; }
  }
  close(); return h;
}
function render(answer){
  // Turn the "Explain Like I'm 13" section into a sticky note
  const i = answer.search(/^#{1,3}\s*.*(13|like i'?m)/im);
  let main = answer, note = '';
  if(i > -1){ main = answer.slice(0, i); note = answer.slice(i); }
  let html = `<div class="ans">${md(main)}`;
  if(note){ const lines = note.split('\n'); html += `<div class="note"><h2>${esc(lines[0].replace(/^#+\s*/,''))}</h2>${md(lines.slice(1).join('\n'))}</div>`; }
  html += `<div class="tools"><button class="btn" id="copy" type="button">Copy answer</button></div></div>`;
  $('out').innerHTML = html;
  $('copy').onclick = () => navigator.clipboard.writeText(answer).then(() => $('copy').textContent = 'Copied');
  $('out').scrollIntoView({behavior:'smooth', block:'start'});
}
function showErr(msg){ $('out').innerHTML = `<div class="ans"><p class="err">${esc(msg)}</p></div>`; }

const steps = ['Reading your question…','Looking at the diagram…','Working out the steps…','Making it simple…'];
let timer;
function loading(on){
  $('go').disabled = on; clearInterval(timer);
  if(!on) return;
  let n = 0;
  const draw = () => $('out').innerHTML = `<div class="ans"><div class="load"><div class="dots"><i></i><i></i><i></i></div><strong>${steps[n++ % steps.length]}</strong></div><div class="sk"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:60%"></div></div>`;
  draw(); timer = setInterval(draw, 2200);
}

$('go').onclick = async () => {
  const question = $('q').value.trim();
  if(!question && !imageData) return showErr('Add a photo or type a question first.');
  loading(true);
  const payload = {
    board: document.querySelector('input[name=board]:checked').value,
    subject: $('subject').value, grade: $('grade').value,
    question, image: imageData, eli13: $('eli13').checked
  };
  try{
    const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    const d = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(d.error || `Server error (${r.status})`);
    loading(false); render(d.answer);
  }catch(e){
    loading(false);
    showErr(e instanceof TypeError ? 'Could not reach the server. Check your internet and that the backend is running.' : e.message);
  }
};
</script>
</body>
</html>
